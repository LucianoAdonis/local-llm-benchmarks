name: tests

on:
  push:
    paths: ["llmbench/**", "tests/**", "scripts/**", "pyproject.toml", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["llmbench/**", "tests/**", "scripts/**", "pyproject.toml", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No install step: the tool has no dependencies and runs from the checkout.
      - name: Unit tests
        run: python -m unittest -v
      - name: System information capture
        run: python -m llmbench sysinfo
      - name: Installs as a package and the command starts
        run: |
          python -m pip install --quiet .
          llmbench --version
      - name: Legacy v1 scripts still compile
        run: python -m compileall -q scripts
      # Timing accuracy on a shared CI machine is informational: noisy neighbours can push
      # a case past its tolerance without the code being wrong.
      - name: Self-test against the mock server (informational)
        continue-on-error: true
        run: python -m llmbench selftest
